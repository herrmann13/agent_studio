name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate semantic version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Tags must use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix."
            exit 1
          }

  package-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            binary_arch: x86_64
            label: Intel
          - runner: macos-15
            arch: arm64
            binary_arch: arm64
            label: Apple Silicon
    name: macOS ${{ matrix.label }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build DMG
        run: make package-macos VERSION="$RELEASE_TAG"
      - name: Validate DMG
        run: |
          test "$(lipo -archs build/bin/agent-studio.app/Contents/MacOS/agent-studio)" = "${{ matrix.binary_arch }}"
          mount_dir=$(mktemp -d)
          dmg="dist/agent-studio-${RELEASE_TAG}-macos-${{ matrix.arch }}.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          [[ "$(diskutil info "$mount_dir")" == *"Volume Name:"*"Agent Studio (${{ matrix.label }})"* ]] || { echo "DMG volume name does not name ${{ matrix.label }}."; exit 1; }
          test -d "$mount_dir/agent-studio.app"
          test -L "$mount_dir/Applications"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/agent-studio-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-24.04
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev squashfs-tools
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build DEB
        run: make package-linux VERSION="$RELEASE_TAG"
      - name: Validate DEB
        run: |
          package="dist/agent-studio-${RELEASE_TAG}-linux-amd64.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Package)" = "agent-studio"
          test "$(dpkg-deb -f "$package" Version)" = "${RELEASE_TAG#v}"
          test "$(dpkg-deb -f "$package" Depends)" = "libgtk-3-0, libwebkit2gtk-4.1-0"
          contents="$(dpkg-deb --contents "$package")"
          [[ "$contents" == *"./usr/bin/agent-studio"* ]]
          libraries="$(ldd build/bin/agent-studio)"
          [[ "$libraries" == *"libwebkit2gtk-4.1.so"* ]]
      - name: Build AppImage
        run: make package-appimage VERSION="$RELEASE_TAG"
      - name: Validate AppImage
        run: |
          package="dist/agent-studio-${RELEASE_TAG}-linux-amd64.AppImage"
          test -f "$package"
          test -x "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/agent-studio-${{ env.RELEASE_TAG }}-linux-amd64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/agent-studio-${{ env.RELEASE_TAG }}-linux-amd64.AppImage
          if-no-files-found: error

  package-cli:
    strategy:
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            arch: arm64
          - runner: macos-15-intel
            goos: darwin
            arch: amd64
          - runner: ubuntu-24.04
            goos: linux
            arch: amd64
          - runner: ubuntu-24.04
            goos: linux
            arch: arm64
    name: CLI ${{ matrix.goos }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build CLI archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/stage
          go build -trimpath -ldflags "-X main.version=$RELEASE_TAG" -o dist/stage/agstudio ./cmd/agstudio
          archive="agstudio-${RELEASE_TAG}-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "dist/$archive" -C dist/stage agstudio
          test -s "dist/$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/agstudio-${{ env.RELEASE_TAG }}-${{ matrix.goos }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [package-macos, package-linux, package-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          assets=(*.dmg *.deb *.AppImage *.tar.gz)
          ((${#assets[@]} == 8)) || { echo "Expected four desktop installers and four CLI archives."; exit 1; }
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Write download notes
        run: |
          cat > release-notes.md <<EOF
          ## Downloads

          | Platform | Installer |
          | --- | --- |
          | macOS — Apple Silicon (M1 or newer) | \`agent-studio-${RELEASE_TAG}-macos-arm64.dmg\` |
          | macOS — Intel | \`agent-studio-${RELEASE_TAG}-macos-amd64.dmg\` |
          | Linux — Debian/Ubuntu | \`agent-studio-${RELEASE_TAG}-linux-amd64.deb\` |
          | Linux — any distribution | \`agent-studio-${RELEASE_TAG}-linux-amd64.AppImage\` |

          ## CLI

          Install the prebuilt terminal interface with Homebrew:

          \`\`\`sh
          brew tap herrmann13/agent_studio https://github.com/herrmann13/agent_studio
          brew install herrmann13/agent_studio/agstudio
          \`\`\`

          CLI archives for macOS (Apple Silicon and Intel) and Linux (ARM64 and x86-64) are attached below.

          Not sure which Mac you have? Open the Apple menu > About This Mac: **Chip: Apple M…** means Apple Silicon, **Processor: Intel** means Intel.
          EOF
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Asset file names keep the suffix the in-app updater matches; the
        # `#label` is only the name shown on the release page.
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --notes "$(cat release-notes.md)" \
            "dist/agent-studio-${RELEASE_TAG}-macos-arm64.dmg#macOS — Apple Silicon (M1 or newer) · agent-studio-${RELEASE_TAG}-macos-arm64.dmg" \
            "dist/agent-studio-${RELEASE_TAG}-macos-amd64.dmg#macOS — Intel · agent-studio-${RELEASE_TAG}-macos-amd64.dmg" \
            "dist/agent-studio-${RELEASE_TAG}-linux-amd64.deb" \
            "dist/agent-studio-${RELEASE_TAG}-linux-amd64.AppImage" \
            "dist/agstudio-${RELEASE_TAG}-darwin-arm64.tar.gz" \
            "dist/agstudio-${RELEASE_TAG}-darwin-amd64.tar.gz" \
            "dist/agstudio-${RELEASE_TAG}-linux-arm64.tar.gz" \
            "dist/agstudio-${RELEASE_TAG}-linux-amd64.tar.gz" \
            dist/SHA256SUMS

  update-homebrew-formula:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Generate Homebrew formula
        run: bash scripts/generate-homebrew-formula.sh "$RELEASE_TAG" dist
      - name: Commit Homebrew formula directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agstudio.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Homebrew formula for $RELEASE_TAG"
          git push origin HEAD:main
