name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate semantic version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Tags must use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix."
            exit 1
          }

  package-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            binary_arch: x86_64
          - runner: macos-15
            arch: arm64
            binary_arch: arm64
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build DMG
        run: make package-macos VERSION="$RELEASE_TAG"
      - name: Validate DMG
        run: |
          test "$(lipo -archs build/bin/agent-studio.app/Contents/MacOS/agent-studio)" = "${{ matrix.binary_arch }}"
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "dist/agent-studio-${RELEASE_TAG}-macos-${{ matrix.arch }}.dmg"
          test -d "$mount_dir/agent-studio.app"
          test -L "$mount_dir/Applications"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/agent-studio-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-24.04
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build DEB
        run: make package-linux VERSION="$RELEASE_TAG"
      - name: Validate DEB
        run: |
          package="dist/agent-studio-${RELEASE_TAG}-linux-amd64.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Package)" = "agent-studio"
          test "$(dpkg-deb -f "$package" Version)" = "${RELEASE_TAG#v}"
          test "$(dpkg-deb -f "$package" Depends)" = "libgtk-3-0, libwebkit2gtk-4.1-0"
          contents="$(dpkg-deb --contents "$package")"
          [[ "$contents" == *"./usr/bin/agent-studio"* ]]
          libraries="$(ldd build/bin/agent-studio)"
          [[ "$libraries" == *"libwebkit2gtk-4.1.so"* ]]
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/agent-studio-${{ env.RELEASE_TAG }}-linux-amd64.deb
          if-no-files-found: error

  publish:
    needs: [package-macos, package-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          shopt -s nullglob
          assets=(dist/*.dmg dist/*.deb)
          ((${#assets[@]} == 3)) || { echo "Expected two DMGs and one DEB."; exit 1; }
          sha256sum "${assets[@]}" > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
